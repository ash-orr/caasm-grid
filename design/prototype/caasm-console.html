if(a==='save'){st.vs={name:''};drawVs()}else if(a==='rm'&&canRemove()){st.vr=curV().id;drawVr()}
else if(a==='csv'||a==='pdf'){const n=st.selAll||!st.sel.size?$('tbl')._rows.length:st.sel.size,nn=st.tab==='devices'?'device':'account';toast(`Export ${a.toUpperCase()}: ${n} ${nn}${n==1?'':'s'}`)}
else if(a==='link'&&canRemove()){const u=location.href.split('#')[0]+'#view='+st.av[st.tab];try{navigator.clipboard.writeText(u).catch(()=>{})}catch(e){}toast('Link copied to clipboard')}
return}
if(t.closest('[data-vrx]')){st.vr=null;drawVr();return}
if(t.closest('[data-vrok]')){const tb=st.tab,L=st.views[tb],i=L.findIndex(x=>x.id===st.vr);if(i>=0){const v=L[i];L.splice(i,1);persistViews();resetTo(tb,v.cv);toast('View removed: '+v.name)}st.vr=null;drawVr();render();return}
if(t.closest('[data-vsx]')){st.vs=null;drawVs();return}
const vok=t.closest('[data-vok]');if(vok){vsave(vok.dataset.vok);return}
const cxb=t.closest('[data-cx]');if(cxb){const ff=curF();mn(ff);ff[cxb.dataset.cx]=[];ff.pg=0;table();return}
const agx=t.closest('[data-agx]');if(agx){const ff=curF();ff.agvOld='';ff.pg=0;table();return}
const orx=t.closest('[data-orx]');if(orx){const ff=curF();mn(ff);ff.otd.splice(+orx.dataset.orx,1);ff.pg=0;table();return}
const oad=t.closest('[data-oadd]');if(oad){const ff=curF();mn(ff);ff.otd.push({k:'',v:''});st.fo.add('devices:otd');table();return}
const chl=t.closest('[data-chipall]');if(chl){st.chipAll=!st.chipAll;table();return}
const cla=t.closest('[data-clra]');if(cla){const ff=curF();Object.assign(ff,st.tab==='devices'?DEVF():ACCF());st.chipAll=false;table();return}
if(st.colOpen&&!t.closest('#colpop')){st.colOpen=false;drawCols()}
if(t.closest('[data-colreset]')){st.cc[st.tab]={order:null,hidden:[...(st.cv?CX[st.tab]:DEFH()[st.tab])]};table();drawCols();return}
const sa2=t.closest('[data-selall]');if(sa2){st.selAll=true;st.selSig=fsig();table();return}
const sc2=t.closest('[data-selclr]');if(sc2){st.selAll=false;st.sel.clear();table();return}
const ra=t.closest('[data-radd]');if(ra){const ff=st.tab==='devices'?st.dev:st.acc;mn(ff);ff.rules.push({s:'',st:''});st.fo.add(st.tab+':rules');table();return}
const rx=t.closest('[data-rx]');if(rx){const ff=st.tab==='devices'?st.dev:st.acc;mn(ff);ff.rules.splice(+rx.dataset.rx,1);ff.pg=0;table();return}
const gx=t.closest('[data-gapx]');if(gx){const ff=st.tab==='devices'?st.dev:st.acc;ff.gap=[];ff.pg=0;table();return}
const fm=t.closest('[data-fm]');if(fm){st.fm=fm.dataset.fm;const[tb0,k0]=st.fm.split(':'),f0=tb0==='devices'?st.dev:st.acc;mn(f0);st.fmd=[...(f0[k0]||[])];st.fmq='';drawFm();return}
if(t.closest('[data-fmx]')){st.fm=null;drawFm();return}
if(t.dataset.mfc!==undefined){const v=t.dataset.mfc;st.mf=t.checked?[...st.mf,v]:st.mf.filter(x=>x!==v);$('mfh').textContent=mfTitle();return}

const mvb=t.closest('[data-mv]');if(mvb){const[k,d]=mvb.dataset.mv.split('|');mv(k,+d);return}
if(t.dataset.ch){const c=st.cc[st.tab],k=t.dataset.ch;c.hidden=t.checked?c.hidden.filter(x=>x!==k):[...c.hidden,k];table();drawCols();return}
if(t.dataset.tab){setView(t.dataset.tab);st.sel.clear();render()}
else if(t.closest&&t.closest('#tf')){st.showF=!st.showF;$('tip').style.display='none';table();$('tf').focus()}

else if(t.id==='clr'){e.preventDefault();Object.assign(f,st.tab==='devices'?DEVF():ACCF());table()}
else if(t.dataset.s){f.dir=f.sort===t.dataset.s?-f.dir:1;f.sort=t.dataset.s;table()}
else if(t.id==='pv'){f.pg--;table()}else if(t.id==='nx'){f.pg++;table()}
else if(t.dataset.a){const a=t.dataset.a,n=st.selAll||(t.hasAttribute('data-all')&&!st.sel.size)?$('tbl')._rows.length:st.sel.size,nn=st.tab==='devices'?'device':'account';toast(a==='Add'?'Add '+nn:`${a}: ${n} ${nn}${n==1?'':'s'}`)}
else if(t.dataset.c!==undefined){const i=+t.dataset.c;if(st.selAll){st.sel=new Set($('tbl')._rows.map(x=>x.id));st.selAll=false}t.checked?st.sel.add(i):st.sel.delete(i);table()}
else if(t.id==='all'){if(st.selAll){st.selAll=false;st.sel.clear()}else $('tbl')._vis.forEach(x=>t.checked?st.sel.add(x.id):st.sel.delete(x.id));table()}
else if(t.closest('tbody tr[data-id]')&&!t.closest('input'))openView(st.tab==='devices'?'device':'account',+t.closest('tr').dataset.id);
else if(t.dataset.mf){const[k,v]=t.dataset.mf.split('|');mn(f);f[k]=t.checked?[...f[k],v]:f[k].filter(x=>x!==v);f.pg=0;table();if(st.fm)drawFm()}
else if(t.dataset.gap){const g=t.dataset.gap;f.gap=t.checked?[...f.gap,g]:f.gap.filter(x=>x!==g);f.pg=0;table()}
else if(t.dataset.priv!==undefined){f.priv=t.checked;f.pg=0;table()}});
document.addEventListener('change',e=>{if(newChange(e))return;if(e.target.dataset&&e.target.dataset.rs){const f=st.tab==='devices'?st.dev:st.acc,[i,k]=e.target.dataset.rs.split('|');mn(f);f.rules[+i][k]=e.target.value;f.pg=0;table();return}const k=e.target.dataset.f;if(k){const f=st.tab==='devices'?st.dev:st.acc;f[k]=e.target.value;f.pg=0;table()}});
document.addEventListener('input',e=>{if(e.target.id==='fms'){st.fmq=e.target.value;$('fmg').innerHTML=fmList();return}if(e.target.id==='vname'){st.vs.name=e.target.value;const b=document.querySelector('[data-vok=new]');if(b)b.disabled=!e.target.value.trim();return}if(e.target.id==='mfs'){st.mfq=e.target.value;$('mf-g').innerHTML=mfList();return}if(e.target.dataset&&e.target.dataset.tf){const f=st.tab==='devices'?st.dev:st.acc,id=e.target.dataset.tf,pos=e.target.selectionStart;f[id]=e.target.value;f.pg=0;table();const n=document.querySelector('[data-tf="'+id+'"]');n.focus();n.setSelectionRange(pos,pos);return}if(e.target.id==='sq'){st.sq=e.target.value;$('sl').innerHTML=sourcesList();return}if(e.target.id==='q'){const f=st.tab==='devices'?st.dev:st.acc;f.q=e.target.value;f.pg=0;const p=e.target.selectionStart;table();const q=$('q');q.focus();q.setSelectionRange(p,p)}});

document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))$('tip').style.display='none'});
